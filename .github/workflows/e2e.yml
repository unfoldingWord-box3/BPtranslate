name: E2E

# Gates the Playwright browser suites that ci.yml deliberately leaves out
# (see the note there). Both suites spin up Wrangler + Vite and drive Chromium,
# so they are slower and more environment-sensitive than the unit checks — hence
# a separate workflow, and separate jobs so a failure in one suite still shows
# the other's result.
#
# Ordering follows #483: the single-spec smoke suite (onboard + AI-translate)
# comes first because it is the smallest surface to get boring-green; the
# concurrency suite (save-protocol races + the #293 RTL direction guard) runs
# alongside it. Promote whichever is stable to a required check via branch
# protection once its green is uneventful — this workflow only makes them run.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older in-flight run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Normally ~2 min; the cap catches a webServer that never turns healthy.
    # 20 rather than 15 so a worst-case install (two capped attempts plus the
    # dpkg repair, ~13 min) still leaves the suite room to run (#655).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Normally 20-55 s. On some runners the apt half of --with-deps crawls
      # (three runs on 2026-10-23 spent 10-13 min fetching packages from the
      # Ubuntu mirror at ~40 kB/s; the browser download itself took ~5 s), so
      # each attempt is capped at 5 min instead of running toward the 6-hour
      # default. Caching ~/.cache/ms-playwright would not help, since the slow
      # part is the system packages (#644).
      #
      # A capped attempt is retried once here, because a manual re-run has
      # always passed (#655). Each attempt carries its own `timeout`: with a
      # bare `cmd || cmd`, a stalled first try would hang until the step's
      # timeout-minutes killed the whole step, retry included. `timeout` runs
      # as the runner user, so its TERM/KILL stops npx and sudo but cannot reach
      # the root apt-get that Playwright starts under `sudo sh -c`; a stalled
      # apt-get can survive and keep holding the dpkg lock. Before the retry we
      # therefore stop any leftover apt-get as root, then let dpkg repair a
      # half-finished unpack (capped at 2 min). Neither may fail the step: the
      # retry itself decides the result. The step cap of 13 min covers both
      # attempts (2 x 5 min 15 s) plus the repair and is only a backstop.
      - name: Install Playwright Chromium
        timeout-minutes: 13
        run: |
          timeout -k 15 5m npx playwright install --with-deps chromium || {
            echo "::warning::Playwright install failed or hit its 5-minute cap; retrying once (#655)"
            sudo pkill -x apt-get || true
            sleep 2
            sudo timeout -k 10 2m dpkg --configure -a || true
            timeout -k 15 5m npx playwright install --with-deps chromium
          }

      # `wrangler dev` reads api/.dev.vars for JWT_SIGNING_KEY (sign-in 500s
      # without it) and SUPER_ADMINS=dev. The example carries both a >=32-char
      # placeholder key and SUPER_ADMINS=dev, which is fine for a throwaway CI
      # run; it is gitignored so this copy is never committed.
      - name: Seed api/.dev.vars
        run: cp api/.dev.vars.example api/.dev.vars

      # scripts/dev-smoke.mjs (playwright.smoke.config.ts's webServer) builds
      # web/dist if missing, wipes + migrates its own --persist-to D1, and
      # launches wrangler (8797) + vite (5175) wired to the translate stub.
      # The stub reverse-proxies org manifests / book files to the real
      # git.door43.org, so this job needs outbound network to Door43.
      # dev-smoke.mjs defaults --persist-to to a Windows path ("C:/be-smoke");
      # point it at a real Linux temp dir for the runner. This has to live on
      # the step, not on the job: the `runner` context is not available in a
      # job-level `env:` block, and using it there makes the whole workflow
      # file fail to compile (startup_failure, zero jobs run).
      - name: Smoke suite (Playwright)
        env:
          SMOKE_PERSIST: ${{ runner.temp }}/be-smoke
        run: npm run test:smoke

      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report-smoke/
          retention-days: 7
          if-no-files-found: ignore

  concurrency:
    runs-on: ubuntu-latest
    # Normally 5-8 min of real work; 30 leaves room for a slow day plus the
    # install step's worst case (two capped attempts plus repair, ~13 min; #655).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same 5-minute cap per attempt and single retry as the smoke job's
      # install step; the comment there explains why (#644, #655).
      - name: Install Playwright Chromium
        timeout-minutes: 13
        run: |
          timeout -k 15 5m npx playwright install --with-deps chromium || {
            echo "::warning::Playwright install failed or hit its 5-minute cap; retrying once (#655)"
            sudo pkill -x apt-get || true
            sleep 2
            sudo timeout -k 10 2m dpkg --configure -a || true
            timeout -k 15 5m npx playwright install --with-deps chromium
          }

      # Same JWT_SIGNING_KEY / SUPER_ADMINS requirement as the smoke job. `npm
      # run dev` (scripts/dev.mjs) would auto-create this file, but the migrate
      # step below runs wrangler first, so seed it up front for determinism.
      - name: Seed api/.dev.vars
        run: cp api/.dev.vars.example api/.dev.vars

      # wrangler dev serves the SPA from web/dist ([assets] in wrangler.toml),
      # so the bundle must exist before the dev server starts.
      - name: Build web bundle
        run: npm run build:web

      # tests/concurrency/global-setup.ts seeds ZEC into the local D1 but does
      # NOT create the schema — apply migrations to the same --local store the
      # webServer's `wrangler dev` will open.
      - name: Apply D1 migrations (local)
        run: npm --workspace api run db:migrate:local

      # playwright.config.ts's webServer runs `npm run dev` (wrangler 8787 +
      # vite 5173) and health-polls /api/health through the Vite proxy, so both
      # servers are up before the specs (one worker, no test-level parallelism).
      - name: Concurrency suite (Playwright)
        run: npm run test:e2e

      - name: Upload concurrency report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
