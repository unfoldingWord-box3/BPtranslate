name: Deploy to dev

# Manual-only: click "Run workflow" on the Actions tab to ship.
# No push trigger, so a merge to main never auto-deploys.
#
# This repo is the dev fork — it deploys the DEV worker only. The production
# deploy (`wrangler deploy --env production`, worker `bptranslate`) is
# intentionally not wired up here; ship prod by hand from a checkout that
# should be touching prod.
#
# The file is named deploy-dev.yml, not deploy.yml, on purpose. A dispatch runs
# the workflow file as it exists ON THE REF YOU PICK. Older branches in this
# fork still carry the old prod-deploying deploy.yml, but GitHub only offers
# workflow_dispatch for workflow files that exist on the default branch, and
# deploy.yml no longer does, so those copies cannot be run.
#
# What remains: anyone with push access can edit THIS file on a branch (say, to
# add `--env production`) and dispatch it from that branch. The token cannot
# stop that. Cloudflare only scopes Workers Scripts:Edit at the account level
# (confirmed in the dashboard 2026-11-09, issue #823), so CLOUDFLARE_API_TOKEN
# can deploy any Worker on the unfoldingWord account, including the prod name
# `bptranslate`. Treat the token as prod-capable.
on:
  workflow_dispatch:

# Avoid two concurrent dev deploys racing each other.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # api typecheck (tsc --noEmit) + web vite build -> web/dist.
      # wrangler deploy below reads ../web/dist as the SPA assets, so this
      # must run first.
      - name: Build
        run: npm run build

      # Keep the remote dev databases in step with the code being deployed —
      # a deploy carrying an unapplied migration otherwise 500s with "no such
      # table". wrangler auto-confirms in non-interactive contexts (CI=true).
      #
      # SAFETY NOTE: what keeps these commands off production is the DATABASE
      # NAME, not the absent --env. Wrangler falls back to an account-wide
      # lookup for names missing from the config, so `d1 migrations apply
      # bptranslate --remote` WOULD reach the prod DB. Never put the prod
      # name here. Also: Cloudflare's D1 token permission is account-wide
      # (no per-database scoping), so the token this step needs can write
      # prod D1 too. Its Workers Scripts permission is account-wide as well
      # (see the header), so treat the token itself as prod-capable.
      - name: Apply D1 migrations (dev databases)
        working-directory: api
        run: |
          npx wrangler d1 migrations apply bptranslate_dev --remote
          npx wrangler d1 migrations apply bptranslate_mltest_dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Uses the wrangler pinned in api/devDependencies (not a separate action)
      # so CI matches a local `wrangler deploy`. NO --env: the default env in
      # wrangler.toml is the dev worker (`bptranslate-dev`, no crons, dev
      # D1). Adding `--env production` here would ship prod — don't.
      #
      # Worker secrets are NOT touched here, and they are per-script: the ones
      # uploaded to `bptranslate` do not carry over to the dev worker.
      # JWT_SIGNING_KEY / DCS_CLIENT_ID / DCS_CLIENT_SECRET / BT_API_TOKEN etc.
      # each need a `wrangler secret put <NAME>` (no --env) against the dev
      # script, or the deploy succeeds and sign-in fails at runtime. Leave
      # DCS_SERVICE_TOKEN unset unless you want the dev worker able to write to
      # the real DCS org — DCS_EXPORT_OWNER is the same in both envs.
      - name: Deploy Worker + SPA (dev)
        working-directory: api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
