name: CI

# Runs on every PR and on pushes to main. Fast, deterministic checks only:
# typecheck + api/web unit tests (the alignment/replace/export regression
# suites) + build.
# The Playwright e2e suites (concurrency + smoke) live in a separate workflow,
# e2e.yml — they spin up Vite + Wrangler and drive Chromium, so they are kept
# out of this fast lane. See #483 for promoting them to required checks.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit across both api/ and web/ workspaces.
      - name: Typecheck
        run: npm run typecheck

      # UI translation coverage. Fails on: a gated locale (see
      # web/src/i18n/coverage.json) missing a key or CLDR plural category, or
      # holding a value that is empty, non-string, still English, or has dropped
      # an interpolation placeholder; a backlog locale LOSING a key it already
      # had; a stale key no longer in en.json; or a STATIC t("ns.key") literal
      # in code that en.json doesn't define. Dynamic keys — t(`ns.${x}`) — can't
      # be resolved statically and are NOT covered by the orphan scan.
      # It does NOT demand that new strings be translated into all 13 locales —
      # only English + the gated locales. See docs/i18n.md.
      - name: i18n coverage
        run: npm run check:i18n

      # Import/export/alignment/lint suites for the Worker — pure-function
      # tests, no D1 or network needed.
      - name: API unit tests
        run: npm --workspace api run test

      # Alignment / replace / morph / conflict regression suites — the real
      # safety net for the edit engine (see CLAUDE.md).
      - name: Web unit tests
        run: npm --workspace web run test

      # api typecheck + web vite build -> web/dist. Catches bundling breaks.
      - name: Build
        run: npm run build
