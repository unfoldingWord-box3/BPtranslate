# Renamed from the bible-editor-* resource set on 2026-09-16 (issue #444).
# This app previously shared its entire Cloudflare footprint — worker, D1, R2
# and Workflow names — with upstream unfoldingWord/bible-editor on the same
# unfoldingWord account (5a3ffd86280d3ed086be76d955829242), so a deploy from
# either repo landed on the same worker. Everything below now carries the
# `bptranslate` prefix (the DNS-safe form of BPtranslate); same account.
# The old bible-editor-* resources are deliberately left untouched and still
# hold the live data until the cutover runbook in
# docs/cloudflare-migration-2026-09.md is worked through.
#
# Dev-suffixed on purpose: the production worker is `bptranslate` (set in
# [env.production] below). With a distinct top-level name, a plain
# `wrangler deploy` (missing `--env production`) lands on a separate dev worker
# instead of overwriting prod with dev bindings.
name = "bptranslate-dev"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Local dev binds to 8787 by default; the web app proxies /api/* to it.
[dev]
port = 8787

# ── DEFAULT ENV (local dev) ─────────────────────────────────────────────────
# `wrangler dev` (and `npm run dev`) reads everything from the top level.
# Vars here are dev-friendly; the prod overrides live in [env.production.*]
# blocks at the bottom. Bindings (D1/R2/DO/Workflow/Assets) are NOT inherited
# by env blocks in wrangler v4 — they're duplicated per env. Dev and prod are
# isolated for stateful resources: D1 (bptranslate_dev vs bptranslate), R2
# (bptranslate-blobs-dev vs bptranslate-blobs), and the Workflow name
# (bptranslate-export-dev vs bptranslate-export). So a plain `wrangler deploy`
# can never read/write prod state. DO + Assets remain identical (no shared
# durable state to clobber).

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Document navigations to /api/* (Sec-Fetch-Dest: document) would otherwise be
# swallowed by the SPA fallback and never hit the Worker — which breaks the
# OAuth start redirect (Sign in with Door43 → 200 index.html instead of 302
# to git.door43.org). Force the Worker to run first for /api/* paths.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "bptranslate_dev"
database_id = "c4ae5e6d-6fb4-4ffc-a82a-008e793c691c"
migrations_dir = "migrations"

# Second binding to the SAME database as DB (same database_id — zero data
# migration). Holds org-independent state (accounts, sessions, lexicon,
# alignment frequencies, UI-string overrides) so it isn't affected by the
# workspace switch — see workspaces.ts's sharedDb().
[[d1_databases]]
binding = "SHARED_DB"
database_name = "bptranslate_dev"
database_id = "c4ae5e6d-6fb4-4ffc-a82a-008e793c691c"

# Per-org content database for the BibleEditorMLTest workspace (dev only —
# there is no production counterpart, so [env.production] deliberately has no
# DB_MLTEST binding and its WORKSPACES stays empty). Referenced by name from
# the WORKSPACES var below.
[[d1_databases]]
binding = "DB_MLTEST"
database_name = "bptranslate_mltest_dev"
database_id = "5c09dc0f-7bb4-4177-a167-3ffe17944866"
migrations_dir = "migrations"

# ── Spare-pool slots (issue #81) ─────────────────────────────────────────────
# Pre-provisioned, empty, MIGRATED D1 databases declared as native bindings so
# the hot path stays native (no D1 HTTP API at request time). Each is then
# registered as an `available` workspace-registry row and claimed for an org at
# onboard (POST /api/workspaces/pool → /pool/claim; see docs/workspace-pool.md).
# Uncomment + fill a real database_id per slot to grow the pool (requires a
# redeploy — native bindings are fixed at deploy time). Keep bindings named
# DB_POOL<n> so registerPoolSlot's default slug derivation ("pool<n>") applies.
#
# [[d1_databases]]
# binding = "DB_POOL1"
# database_name = "bptranslate_pool1_dev"
# database_id = "REPLACE_WITH_wrangler_d1_create_id"
# migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "bptranslate-blobs-dev"

# Binding and class name are unchanged by the bptranslate rename, and don't
# need to change: a Durable Object namespace is scoped to the script that
# declares it, so `bptranslate-dev`'s ChapterRoom objects are naturally a
# separate namespace from `bible-editor-api-dev`'s (and from prod's). Nothing
# to migrate either — ChapterRoom holds only live WS presence/fanout; HTTP +
# If-Match is the source of truth.
[[durable_objects.bindings]]
name = "CHAPTER_ROOM"
class_name = "ChapterRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChapterRoom"]

[[workflows]]
# Dev-suffixed: Workflow names are account-scoped and owned by one script, so
# sharing prod's name ("bptranslate-export") would let a plain dev deploy
# collide with prod's workflow. Binding stays EXPORT_WORKFLOW so code is
# unaffected.
name = "bptranslate-export-dev"
binding = "EXPORT_WORKFLOW"
class_name = "ExportWorkflow"

[[workflows]]
# Internal translate runner (issue #445, docs/translate-internal-runner.md).
# Dev-suffixed for the same reason as the export workflow above.
name = "bptranslate-translate-dev"
binding = "TRANSLATE_WORKFLOW"
class_name = "TranslateWorkflow"

# No crons on the default env: they're registered only on production (below)
# so an accidental dev deploy can't double-fire the nightly export.
# `wrangler dev --test-scheduled` exposes /__scheduled regardless.
# This is spelled as an explicit empty list rather than an omitted [triggers]
# block on purpose — omitting it leaves whatever crons are already attached to
# the dev script in place, so it can't *guarantee* the dev worker is cron-free.
# `crons = []` actively clears them on every deploy.
[triggers]
crons = []

# Public-safe defaults; secrets go in `wrangler secret put` (DCS_CLIENT_ID,
# DCS_CLIENT_SECRET, JWT_SIGNING_KEY, DCS_SERVICE_TOKEN, BT_API_TOKEN,
# AI_KEY_WRAPPING_KEY).
# ALLOWED_ORIGINS empty → falls back to the dev allowlist inside src/index.ts
# (localhost:5173 / 8787 only).
# DEV_AUTH_ENABLED gates the /api/auth/dev mint endpoint; flipped to "false"
# in the prod env block below.
# DCS_EXPORT_OWNER controls which owner nightly exports land on (the branch is
# derived per-book from contributors, not configured).
# BT_API_TOKEN (secret) authorizes /api/tn-quick + /api/pipelines/*.
# AI_KEY_WRAPPING_KEY (secret) wraps each org's own AI provider API key stored
# in ai_provider_config — base64 of 32 random bytes (`openssl rand -base64 32`).
# Unset → orgs can't store a key (/api/ai-provider reports encryptionAvailable
# false); the shared BT_API_TOKEN path still works.
# TN_QUICK_URL / PIPELINE_API_BASE override the bot endpoints.
#
# WORKSPACES: JSON array of per-org workspaces, e.g.
#   [{"slug":"uw","label":"unfoldingWord","org":"unfoldingWord","binding":"DB"}]
# Empty/unset (the default) means exactly one implicit workspace using the
# DB binding above — today's single-org behavior, unchanged. To add an org:
#   1. wrangler d1 create <name>
#   2. add a [[d1_databases]] binding for it (here and in [env.production])
#   3. add its JSON entry to WORKSPACES (here and in [env.production.vars])
#   4. deploy
#   5. wrangler d1 migrations apply <name> --remote
#   6. onboard the org via the Setup wizard
#
# WORKSPACE_AUTOCLAIM: "true" lets an admin of a Door43 org that has NO
# workspace claim a spare pool slot for it at sign-in (docs/workspace-pool.md).
# Unset/anything else = off, which is the default and the right one for a
# single-org deployment: git.door43.org is a public Gitea, so anyone can create
# an org, create a BE-Admins team, and self-serve a workspace out of the pool.
# Turn it on only where self-service onboarding is the intent and the pool is
# expendable. It also requires an EXPLICIT roster (registry rows, or WORKSPACES
# below) — with neither, auto-claim refuses, because the first row written to an
# empty registry would replace the implicit default rather than join it.
#
# SUPER_ADMINS: comma-separated DCS usernames (case-insensitive) who may
# switch to any workspace regardless of DCS org membership, and are treated
# as admin in every workspace regardless of that workspace's user_roles table
# — this is what makes bootstrapping a brand-new org possible (a fresh
# workspace's user_roles only has whatever migration 0016 seeds, so the first
# person in would otherwise be locked out of the Setup wizard). Empty = nobody.
[vars]
DCS_BASE_URL = "https://git.door43.org"
DCS_OAUTH_AUTHORIZE_URL = "https://git.door43.org/login/oauth/authorize"
DCS_OAUTH_TOKEN_URL = "https://git.door43.org/login/oauth/access_token"
JWT_ISSUER = "bible-editor"
JWT_TTL_SECONDS = "1209600"
ALLOWED_ORIGINS = ""
DEV_AUTH_ENABLED = "true"
DCS_EXPORT_OWNER = "BibleEditorService"
TN_QUICK_URL = "https://uw-bt-bot.fly.dev/api/tn-quick"
PIPELINE_API_BASE = "https://uw-bt-bot.fly.dev"
# Internal translate runner (issue #445, docs/translate-internal-runner.md).
# OPT-IN: "proxy" (the default, and any value other than "internal") keeps every
# pipeline job on the Fly bot exactly as before. "internal" routes a job to
# TRANSLATE_WORKFLOW only when ALL of the remaining gates also pass — the job is
# a translate job, the org brought its own provider key, and that provider is
# listed below. Flip this to "internal" in api/.dev.vars for a local dry run
# rather than here, so a dev deploy can't turn it on for everyone.
PIPELINE_MODE = "proxy"
# Providers with an in-Worker adapter. OpenAI / xAI have none and stay proxied.
# Blanking this var disables the internal runner on its own, and listing a
# provider here is inert while PIPELINE_MODE is "proxy" — which is what makes it
# safe to list gemini BEFORE its first live call. Claude has been exercised
# against the real API; gemini has NOT (issue #445). Do not flip PIPELINE_MODE
# to "internal" on a deployment that can pick gemini until that live run has
# happened.
PIPELINE_INTERNAL_PROVIDERS = "claude,gemini"
# Dev has two workspaces: the existing dev database (BSOJ, and also the
# SHARED_DB holding accounts/sessions/lexicon) plus an empty database for the
# test org. The FIRST entry is the fallback when no be_ws cookie is present,
# so it must stay pointed at the DB binding — that keeps a cookie-less request
# behaving exactly as it did before workspaces existed.
WORKSPACES = '[{"slug":"bsoj","label":"BSOJ (العربية)","org":"BSOJ","binding":"DB"},{"slug":"mltest","label":"BibleEditorMLTest","org":"BibleEditorMLTest","binding":"DB_MLTEST"}]'
# Empty on purpose — this block DEPLOYS to the public dev worker, and
# `SUPER_ADMINS = "dev"` there would hand every-workspace admin to whoever
# registers the (currently unclaimed) username `dev` on git.door43.org.
# For LOCAL `wrangler dev`, set it in api/.dev.vars instead (never deployed):
#   SUPER_ADMINS=dev
# "dev" is the username `/api/auth/dev` mints, which has no DCS access token
# and therefore no checkable org membership — without that line, local
# dev-auth can't switch workspaces (default-workspace admin still works;
# mintDevToken self-grants it). Real Door43 OAuth doesn't need it.
SUPER_ADMINS = ""

# ── PRODUCTION ENV ──────────────────────────────────────────────────────────
# Activated by `wrangler deploy --env production` (which is what `npm run
# deploy` runs). `name` is repeated so the deploy lands on the
# `bptranslate` worker instead of a name-suffixed
# `bptranslate-production`. Secrets are scoped to the Worker, so they
# carry over without re-uploading.

[env.production]
name = "bptranslate"
# The OAuth token used to deploy is a member of more than one Cloudflare
# account, so any `--remote` / `--env production` command without this would
# abort non-interactively ("More than one account available but unable to
# select one in non-interactive mode"). This is the unfoldingWord account,
# which owns the deployed `bptranslate` worker and all three D1 databases.
# The default (dev) env deliberately has no account_id here — leaving it unset
# keeps dev-only remote commands from silently resolving to the wrong account
# for a contributor who isn't a member of unfoldingWord. See the Deploy
# section in CLAUDE.md; this removes the need to export CLOUDFLARE_ACCOUNT_ID
# by hand for prod commands.
account_id = "5a3ffd86280d3ed086be76d955829242"

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "bptranslate"
database_id = "247c4a41-eaf4-4d49-bce2-68f4d1bbe00e"
migrations_dir = "migrations"

# See the [vars] block above for what this binding is for — same database_id
# as DB, so this is zero data migration, not a second database.
[[env.production.d1_databases]]
binding = "SHARED_DB"
database_name = "bptranslate"
database_id = "247c4a41-eaf4-4d49-bce2-68f4d1bbe00e"

[[env.production.r2_buckets]]
binding = "BLOBS"
bucket_name = "bptranslate-blobs"

[[env.production.durable_objects.bindings]]
name = "CHAPTER_ROOM"
class_name = "ChapterRoom"

[[env.production.migrations]]
tag = "v1"
new_classes = ["ChapterRoom"]

[[env.production.workflows]]
name = "bptranslate-export"
binding = "EXPORT_WORKFLOW"
class_name = "ExportWorkflow"

[[env.production.workflows]]
name = "bptranslate-translate"
binding = "TRANSLATE_WORKFLOW"
class_name = "TranslateWorkflow"

[env.production.triggers]
# Export cron retimed to 05:30 UTC (was "0 6 * * *") so the -be- branches land
# ~30 min before Rich's 06:00 UTC DCS-side validate-and-merge job (sequence:
# export -> per-push validation -> 06:00 merge). The */5 pipeline-poll cron is
# unrelated (AI auto-apply).
# Future: nightly DCS re-import is wired up in src/index.ts (REIMPORT_CRON
# branch) but deliberately not registered yet. Add "0 8 * * *" once the
# export → DCS git-action merge loop is verified end-to-end.
crons = ["30 5 * * *", "*/5 * * * *"]

# WORKSPACES / SUPER_ADMINS: see the [vars] block above for format + the
# steps to add an org. SUPER_ADMINS users can switch to any workspace and are
# treated as admin in every workspace.
[env.production.vars]
DCS_BASE_URL = "https://git.door43.org"
DCS_OAUTH_AUTHORIZE_URL = "https://git.door43.org/login/oauth/authorize"
DCS_OAUTH_TOKEN_URL = "https://git.door43.org/login/oauth/access_token"
JWT_ISSUER = "bible-editor"
JWT_TTL_SECONDS = "1209600"
ALLOWED_ORIGINS = "https://bptranslate.unfoldingword.workers.dev"
DEV_AUTH_ENABLED = "false"
# Set ONLY here (prod), never in the default [vars] block: production registers
# the nightly export cron ([env.production.triggers] above), the dev worker does
# not (crons = []). The UI reads this to show the 05:30 schedule vs. a
# "use Run export now" notice, so a cron-less deployment doesn't imply exports
# are silently failing (#240). Keep it in sync with the crons list above.
NIGHTLY_EXPORTS_ENABLED = "true"
DCS_EXPORT_OWNER = "BibleEditorService"
TN_QUICK_URL = "https://uw-bt-bot.fly.dev/api/tn-quick"
PIPELINE_API_BASE = "https://uw-bt-bot.fly.dev"
# Internal translate runner (issue #445, docs/translate-internal-runner.md).
# OPT-IN: "proxy" (the default, and any value other than "internal") keeps every
# pipeline job on the Fly bot exactly as before. "internal" routes a job to
# TRANSLATE_WORKFLOW only when ALL of the remaining gates also pass — the job is
# a translate job, the org brought its own provider key, and that provider is
# listed below. Flip this to "internal" in api/.dev.vars for a local dry run
# rather than here, so a dev deploy can't turn it on for everyone.
PIPELINE_MODE = "proxy"
# Providers with an in-Worker adapter. OpenAI / xAI have none and stay proxied.
# Blanking this var disables the internal runner on its own, and listing a
# provider here is inert while PIPELINE_MODE is "proxy" — which is what makes it
# safe to list gemini BEFORE its first live call. Claude has been exercised
# against the real API; gemini has NOT (issue #445). Do not flip PIPELINE_MODE
# to "internal" on a deployment that can pick gemini until that live run has
# happened.
PIPELINE_INTERNAL_PROVIDERS = "claude,gemini"
WORKSPACES = ""
SUPER_ADMINS = ""
