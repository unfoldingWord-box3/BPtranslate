<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rapid check by issue type, compact</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@400;600&amp;family=Noto+Serif+Hebrew:wght@400;600&amp;display=swap">

body{margin:0}
</style>
</helmet>
<div style="width: 100%; background: #F4F5F7">

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>

  renderVals() { return {}; }
}
